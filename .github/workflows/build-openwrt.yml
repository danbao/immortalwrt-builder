name: Build OpenWrt

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Build runner; self-hosted runners never receive repository write permission
        required: true
        default: ubuntu-24.04
        type: choice
        options:
          - ubuntu-24.04
          - self-hosted
      ib_version:
        description: ImmortalWrt ImageBuilder version
        required: true
        default: 25.12.1
      build_mode:
        description: Validate only, build a temporary artifact, or publish a release
        required: true
        default: publish
        type: choice
        options:
          - publish
          - dry-run
          - validate
  schedule:
    # Daily 02:00 Asia/Shanghai.
    - cron: "0 18 * * *"

permissions:
  contents: read

concurrency:
  group: build-openwrt
  cancel-in-progress: false

env:
  IB_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.ib_version || '25.12.1' }}
  BUILD_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.build_mode || 'publish' }}
  BUILD_PROFILE_CONFIG: config/build-profile.json

jobs:
  build:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      count: ${{ steps.convert.outputs.count || '0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Clean previous build state
        run: |
          rm -rf imagebuilder build-out dist "immortalwrt-imagebuilder-${IB_VERSION}-x86-64.Linux-x86_64.tar.zst"
          mkdir -p build-out dist

      - name: Validate build profile
        run: |
          python3 scripts/openwrt_build_preflight.py validate-profile \
            --config "${BUILD_PROFILE_CONFIG}" \
            --github-env "${GITHUB_ENV}"

      - name: Install dependencies
        run: |
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          sudo apt-get install -y -o Acquire::Retries=3 -o Acquire::http::Timeout=120 -o Acquire::https::Timeout=120 \
            build-essential libncurses-dev zlib1g-dev gawk git gettext \
            libssl-dev xsltproc rsync wget unzip python3 zstd qemu-utils

      - name: Download verified ImageBuilder
        run: |
          python3 scripts/openwrt_build_preflight.py imagebuilder-info \
            --version "${IB_VERSION}" \
            --target x86/64 \
            --github-env "${GITHUB_ENV}" \
            --retries 8 \
            --timeout 30
          source "${GITHUB_ENV}"
          python3 scripts/openwrt_build_preflight.py download-url \
            --url "${IB_BASE_URL}/${IB_ARCHIVE}" \
            --output "${IB_ARCHIVE}" \
            --sha256 "${IB_ARCHIVE_SHA256}" \
            --retries 8 \
            --timeout 300
          tar --zstd -xf "${IB_ARCHIVE}"
          mv "immortalwrt-imagebuilder-${IB_VERSION}-x86-64.Linux-x86_64" imagebuilder

      - name: Validate ImageBuilder security configuration
        run: |
          sed -i \
            -e 's/^CONFIG_ISO_IMAGES=y/# CONFIG_ISO_IMAGES is not set/' \
            -e 's/^CONFIG_QCOW2_IMAGES=y/# CONFIG_QCOW2_IMAGES is not set/' \
            -e 's/^CONFIG_VDI_IMAGES=y/# CONFIG_VDI_IMAGES is not set/' \
            -e 's/^CONFIG_VMDK_IMAGES=y/# CONFIG_VMDK_IMAGES is not set/' \
            -e 's/^CONFIG_VHDX_IMAGES=y/# CONFIG_VHDX_IMAGES is not set/' \
            imagebuilder/.config
          python3 scripts/openwrt_build_preflight.py validate-imagebuilder \
            --profile "${BUILD_PROFILE_CONFIG}" \
            --config imagebuilder/.config
          cp imagebuilder/.config build-out/imagebuilder.config

      - name: Collect upstream metadata
        run: |
          source "${GITHUB_ENV}"
          python3 scripts/openwrt_build_preflight.py download-url \
            --url "${IB_BASE_URL}/version.buildinfo" \
            --output build-out/version.buildinfo \
            --retries 8 \
            --timeout 30
          version_code="$(tr -d '[:space:]' < build-out/version.buildinfo)"
          immortalwrt_commit="${version_code##*-}"
          if [ -z "${version_code}" ] || [ "${immortalwrt_commit}" = "${version_code}" ]; then
            echo "Failed to parse ImmortalWrt version.buildinfo: ${version_code}" >&2
            exit 1
          fi
          {
            echo "BUILD_DATE=$(TZ=Asia/Shanghai date +%Y%m%d)"
            echo "IMMORTALWRT_VERSION_CODE=${version_code}"
            echo "IMMORTALWRT_COMMIT=${immortalwrt_commit}"
          } >> "${GITHUB_ENV}"

      - name: Validate official package manifest
        run: |
          cd imagebuilder
          make manifest PROFILE="${BUILD_PROFILE}" PACKAGES="${BUILD_PACKAGES}" \
            | tee "${GITHUB_WORKSPACE}/build-out/manifest.log"
          awk '/^[A-Za-z0-9_.+:-]+ - / {print}' "${GITHUB_WORKSPACE}/build-out/manifest.log" \
            > "${GITHUB_WORKSPACE}/build-out/official.packages.manifest"
          cd "${GITHUB_WORKSPACE}"
          python3 scripts/openwrt_build_preflight.py validate-manifest \
            --profile "${BUILD_PROFILE_CONFIG}" \
            --manifest build-out/official.packages.manifest \
            --metadata-out build-out/official-packages.json

      - name: Upload validation evidence
        if: env.BUILD_MODE == 'validate'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openwrt-validation-${{ env.IB_VERSION }}-${{ github.run_id }}
          path: |
            build-out/imagebuilder.config
            build-out/official.packages.manifest
            build-out/official-packages.json
            build-out/version.buildinfo
          retention-days: 7
          if-no-files-found: error

      - name: Build official image
        if: env.BUILD_MODE != 'validate'
        run: |
          cd imagebuilder
          rm -rf bin/targets/x86/64
          make image \
            PROFILE="${BUILD_PROFILE}" \
            FILES="${GITHUB_WORKSPACE}/files" \
            ROOTFS_PARTSIZE="${ROOTFS_PARTSIZE}" \
            PACKAGES="${BUILD_PACKAGES}"
          cd "${GITHUB_WORKSPACE}"
          python3 scripts/openwrt_build_preflight.py collect-image-outputs \
            --target-dir imagebuilder/bin/targets/x86/64 \
            --image-glob "${IMAGE_GLOB}" \
            --out-dir build-out \
            --image-name "${IMAGE_NAME}"
          cd imagebuilder
          for info in config.buildinfo feeds.buildinfo version.buildinfo; do
            if [ -s "bin/targets/x86/64/${info}" ]; then
              cp "bin/targets/x86/64/${info}" "${GITHUB_WORKSPACE}/build-out/${info}"
            fi
          done

      - name: Convert image to OVA
        id: convert
        if: env.BUILD_MODE != 'validate'
        run: |
          conversion_manifest=manifests/converted-images.json
          if [ "${BUILD_MODE}" = "dry-run" ]; then
            builder_version="$(python3 -c 'import sys; sys.path.insert(0, "scripts"); import openwrt_img_to_ova; print(openwrt_img_to_ova.BUILDER_VERSION)')"
            printf '{"builder_version":"%s","conversions":{}}\n' "${builder_version}" > build-out/empty-conversions.json
            conversion_manifest=build-out/empty-conversions.json
          fi
          python3 scripts/openwrt_img_to_ova.py scan \
            --img-dir build-out \
            --manifest "${conversion_manifest}" \
            --out-dir dist \
            --results dist/build-results.json \
            --nic-count "${NIC_COUNT}" \
            --release-date "${BUILD_DATE}" \
            --immortalwrt-version-code "${IMMORTALWRT_VERSION_CODE}" \
            --immortalwrt-commit "${IMMORTALWRT_COMMIT}"
          count="$(python3 -c 'import json; print(len(json.load(open("dist/build-results.json"))["built"]))')"
          echo "count=${count}" >> "${GITHUB_OUTPUT}"

      - name: Prepare release payload
        if: env.BUILD_MODE != 'validate' && steps.convert.outputs.count != '0'
        run: |
          source "${GITHUB_ENV}"
          build_info_args=()
          for info in build-out/imagebuilder.config build-out/config.buildinfo build-out/feeds.buildinfo build-out/version.buildinfo; do
            if [ -s "${info}" ]; then
              build_info_args+=(--build-info-file "${info}")
            fi
          done
          runner_type="GitHub-hosted"
          if [ "${{ inputs.runner || 'ubuntu-24.04' }}" = "self-hosted" ]; then
            runner_type="self-hosted"
          fi
          python3 scripts/openwrt_img_to_ova.py prepare-assets \
            --results dist/build-results.json \
            --source-dir build-out \
            --out-dir dist \
            --profile "${BUILD_PROFILE_CONFIG}" \
            --package-manifest build-out/final-image.manifest \
            --sbom build-out/final-image.bom.cdx.json \
            --package-metadata build-out/official-packages.json \
            --setup-wizard scripts/setup-openwrt.sh \
            "${build_info_args[@]}" \
            --imagebuilder-version "${IB_VERSION}" \
            --imagebuilder-url "${IB_BASE_URL}/${IB_ARCHIVE}" \
            --imagebuilder-sha256 "${IB_ARCHIVE_SHA256}" \
            --immortalwrt-version-code "${IMMORTALWRT_VERSION_CODE}" \
            --immortalwrt-commit "${IMMORTALWRT_COMMIT}" \
            --repository-commit "${GITHUB_SHA}" \
            --workflow-run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --runner-type "${runner_type}"

      - name: Summarize build
        if: always()
        run: |
          {
            echo "## OpenWrt build"
            echo "- Mode: \`${BUILD_MODE}\`"
            echo "- ImageBuilder: \`${IB_VERSION}\`"
            echo "- Built images: \`${{ steps.convert.outputs.count || '0' }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload dry-run payload
        if: env.BUILD_MODE == 'dry-run' && steps.convert.outputs.count != '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openwrt-dry-run-${{ env.IB_VERSION }}-${{ github.run_id }}
          path: |
            build-out/*
            dist/*
          retention-days: 14
          compression-level: 0
          if-no-files-found: error

      - name: Upload publish handoff
        if: env.BUILD_MODE == 'publish' && steps.convert.outputs.count != '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openwrt-publish-${{ github.run_id }}
          path: dist/*
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openwrt-failure-${{ github.run_id }}
          path: |
            build-out/*
            dist/*
          retention-days: 7
          if-no-files-found: warn

  publish:
    needs: build
    if: (github.event_name != 'workflow_dispatch' || inputs.build_mode == 'publish') && needs.build.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout trusted publish workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download publish handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: openwrt-publish-${{ github.run_id }}
          path: dist

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/publish_releases.py dist/build-results.json \
            --keep-releases 30 \
            --expected-repository-commit "${GITHUB_SHA}" \
            --expected-workflow-run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Record release with conflict retries
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REF: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/update_release_records.py \
            --results dist/build-results.json \
            --target-ref "${TARGET_REF}" \
            --attempts 3
