name: Build OpenWrt

on:
  workflow_dispatch:
    inputs:
      ib_version:
        description: ImmortalWrt ImageBuilder version; use 25.12.1 with publish_release=false for dry-run validation
        required: true
        default: "24.10.6"
      publish_release:
        description: Publish GitHub Release and record manifest/docs
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  schedule:
    # Daily 02:00 Asia/Shanghai
    - cron: "0 18 * * *"

permissions:
  contents: write

concurrency:
  group: build-openwrt
  cancel-in-progress: false

env:
  IB_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.ib_version || '24.10.6' }}
  PUBLISH_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release || 'true' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev zlib1g-dev gawk git gettext \
            libssl-dev xsltproc rsync wget unzip python3 zstd qemu-utils

      - name: Download ImageBuilder
        run: |
          python3 scripts/openwrt_build_preflight.py imagebuilder-info \
            --version "${IB_VERSION}" \
            --target "x86/64" \
            --github-env "${GITHUB_ENV}" \
            --retries 8 \
            --timeout 30
          source "${GITHUB_ENV}"
          python3 scripts/openwrt_build_preflight.py download-url \
            --url "${IB_BASE_URL}/${IB_ARCHIVE}" \
            --output "${IB_ARCHIVE}" \
            --sha256 "${IB_ARCHIVE_SHA256}" \
            --retries 8 \
            --timeout 300
          tar --zstd -xf "${IB_ARCHIVE}"
          mv "immortalwrt-imagebuilder-${IB_VERSION}-x86-64.Linux-x86_64" imagebuilder

      - name: Collect release metadata
        run: |
          source "${GITHUB_ENV}"
          version_code="$(curl -fsSL --retry 8 --retry-delay 5 --connect-timeout 30 "${IB_BASE_URL}/version.buildinfo" | tr -d '[:space:]')"
          immortalwrt_commit="${version_code##*-}"
          if [ -z "${version_code}" ] || [ "${immortalwrt_commit}" = "${version_code}" ]; then
            echo "Failed to parse ImmortalWrt version.buildinfo: ${version_code}" >&2
            exit 1
          fi
          {
            echo "BUILD_DATE=$(TZ=Asia/Shanghai date +%Y%m%d)"
            echo "IMMORTALWRT_VERSION_CODE=${version_code}"
            echo "IMMORTALWRT_COMMIT=${immortalwrt_commit}"
          } >> "${GITHUB_ENV}"
          echo "ImmortalWrt version: ${version_code}"
          echo "ImmortalWrt commit: ${immortalwrt_commit}"

      - name: Disable auxiliary image formats
        run: |
          cd imagebuilder
          sed -i \
            -e 's/^CONFIG_ISO_IMAGES=y/# CONFIG_ISO_IMAGES is not set/' \
            -e 's/^CONFIG_QCOW2_IMAGES=y/# CONFIG_QCOW2_IMAGES is not set/' \
            -e 's/^CONFIG_VDI_IMAGES=y/# CONFIG_VDI_IMAGES is not set/' \
            -e 's/^CONFIG_VMDK_IMAGES=y/# CONFIG_VMDK_IMAGES is not set/' \
            -e 's/^CONFIG_VHDX_IMAGES=y/# CONFIG_VHDX_IMAGES is not set/' \
            .config
          grep -E "^(CONFIG_(ISO|QCOW2|VDI|VMDK|VHDX)_IMAGES|# CONFIG_(ISO|QCOW2|VDI|VMDK|VHDX)_IMAGES)" .config

      - name: Configure third-party package feeds
        run: |
          cd imagebuilder
          python3 "${GITHUB_WORKSPACE}/scripts/openwrt_build_preflight.py" append-feeds \
            --feed-file "${GITHUB_WORKSPACE}/config/third-party-feeds.tsv" \
            --repositories-conf repositories.conf

      - name: Verify third-party feeds are reachable
        run: |
          python3 scripts/openwrt_build_preflight.py check-feeds \
            --feed-file config/third-party-feeds.tsv \
            --retries 3 \
            --timeout 20

      - name: Add local packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd imagebuilder
          mkdir -p packages
          python3 "${GITHUB_WORKSPACE}/scripts/openwrt_build_preflight.py" download-release-asset \
            --repo Openwrt-Passwall/openwrt-passwall2 \
            --pattern 'luci-app-passwall2_*_all.ipk' \
            --dir packages \
            --retries 8 \
            --timeout 60
          python3 "${GITHUB_WORKSPACE}/scripts/openwrt_build_preflight.py" download-release-asset \
            --repo asvow/luci-app-tailscale \
            --pattern 'luci-app-tailscale_*_all.ipk' \
            --dir packages \
            --retries 8 \
            --timeout 60
          python3 "${GITHUB_WORKSPACE}/scripts/openwrt_build_preflight.py" download-release-asset \
            --repo sbwml/luci-app-mosdns \
            --pattern 'x86_64-openwrt-24.10.tar.gz' \
            --dir /tmp/mosdns \
            --retries 8 \
            --timeout 120
          mkdir -p /tmp/mosdns/extract
          tar -xzf /tmp/mosdns/x86_64-openwrt-24.10.tar.gz -C /tmp/mosdns/extract
          # Move each extracted ipk verbosely so multi-ipk bundles are easy to debug.
          find /tmp/mosdns/extract -type f -name '*.ipk' -print -exec mv -f {} packages/ \;
          ls -lh packages/

      - name: Preflight package manifest
        run: |
          cd imagebuilder
          packages="$(python3 "${GITHUB_WORKSPACE}/scripts/openwrt_build_preflight.py" package-string --package-file "${GITHUB_WORKSPACE}/config/openwrt-packages.txt")"
          make manifest PROFILE="generic" PACKAGES="${packages}"

      - name: Build image
        run: |
          cd imagebuilder
          packages="$(python3 "${GITHUB_WORKSPACE}/scripts/openwrt_build_preflight.py" package-string --package-file "${GITHUB_WORKSPACE}/config/openwrt-packages.txt")"
          make image PROFILE="generic" FILES="${GITHUB_WORKSPACE}/files" ROOTFS_PARTSIZE="2048" PACKAGES="${packages}"

      - name: Collect image
        run: |
          shopt -s nullglob
          images=(imagebuilder/bin/targets/x86/64/*squashfs-combined-efi.img.gz)
          if [ "${#images[@]}" -ne 1 ]; then
            echo "Expected exactly one squashfs EFI image, found ${#images[@]}" >&2
            printf '%s\n' "${images[@]}" >&2
            exit 1
          fi
          image="${images[0]}"
          mkdir -p build-out
          cp "${image}" build-out/immortalwrt-x86-64.img.gz
          ls -lh build-out/

      - name: Convert to OVA
        id: convert
        run: |
          python3 scripts/openwrt_img_to_ova.py scan \
            --img-dir build-out \
            --manifest manifests/converted-images.json \
            --out-dir dist \
            --results dist/build-results.json \
            --nic-count 1 \
            --release-date "${BUILD_DATE}" \
            --immortalwrt-version-code "${IMMORTALWRT_VERSION_CODE}" \
            --immortalwrt-commit "${IMMORTALWRT_COMMIT}"
          count="$(python3 -c 'import json; print(len(json.load(open("dist/build-results.json"))["built"]))')"
          echo "count=${count}" >> "${GITHUB_OUTPUT}"

      - name: Publish release
        if: steps.convert.outputs.count != '0' && env.PUBLISH_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image_asset="$(python3 -c 'import json; print(json.load(open("dist/build-results.json"))["built"][0]["image_asset"])')"
          cp build-out/immortalwrt-x86-64.img.gz "dist/${image_asset}"
          python3 scripts/publish_releases.py dist/build-results.json --keep-releases 30

      - name: Record converted images
        if: steps.convert.outputs.count != '0' && env.PUBLISH_RELEASE == 'true'
        run: |
          tag="$(python3 -c 'import json; print(json.load(open("dist/build-results.json"))["built"][0]["release_tag"])')"
          python3 scripts/openwrt_img_to_ova.py record \
            --results dist/build-results.json \
            --manifest manifests/converted-images.json \
            --doc docs/converted-images.md
          python3 scripts/openwrt_build_preflight.py verify-records \
            --manifest manifests/converted-images.json \
            --doc docs/converted-images.md \
            --release-tag "${tag}" \
            --check-latest-release
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifests/converted-images.json docs/converted-images.md
          git commit -m "docs: record converted OpenWrt images [skip ci]" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload dry-run artifacts
        if: env.PUBLISH_RELEASE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-dry-run-${{ env.IB_VERSION }}
          path: |
            build-out/*
            dist/*
          if-no-files-found: error
