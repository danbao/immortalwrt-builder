name: Build ImmortalWrt

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a GitHub Release after all checks pass
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: read

concurrency:
  group: build-immortalwrt
  cancel-in-progress: false

env:
  IB_VERSION: "25.12.1"
  IB_TARGET: x86/generic

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      count: ${{ steps.convert.outputs.count }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-utils python3 zstd

      - name: Validate repository
        run: |
          python3 -m py_compile scripts/*.py
          python3 -m unittest discover -s tests
          jq empty config/third-party-components.json
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Download verified ImageBuilder
        run: |
          python3 scripts/openwrt_build_preflight.py imagebuilder-info \
            --version "${IB_VERSION}" \
            --target "${IB_TARGET}" \
            --github-env "${GITHUB_ENV}" \
            --retries 8 \
            --timeout 30
          # shellcheck disable=SC1090
          source "${GITHUB_ENV}"
          python3 scripts/openwrt_build_preflight.py download-url \
            --url "${IB_BASE_URL}/${IB_ARCHIVE}" \
            --output "${IB_ARCHIVE}" \
            --sha256 "${IB_ARCHIVE_SHA256}" \
            --retries 8 \
            --timeout 300
          tar --zstd -xf "${IB_ARCHIVE}"
          mv "immortalwrt-imagebuilder-${IB_VERSION}-${IB_TARGET//\//-}.Linux-x86_64" imagebuilder

      - name: Collect upstream metadata
        run: |
          version_code="$(curl -fsSL --retry 8 --retry-delay 5 --connect-timeout 30 "${IB_BASE_URL}/version.buildinfo" | tr -d '[:space:]')"
          immortalwrt_commit="${version_code##*-}"
          if [ -z "${version_code}" ] || [ "${immortalwrt_commit}" = "${version_code}" ]; then
            echo "Failed to parse ImmortalWrt version.buildinfo: ${version_code}" >&2
            exit 1
          fi
          BUILD_DATE="$(TZ=Asia/Shanghai date +%Y%m%d)"
          IMMORTALWRT_VERSION_CODE="${version_code}"
          IMMORTALWRT_COMMIT="${immortalwrt_commit}"
          {
            echo "BUILD_DATE=${BUILD_DATE}"
            echo "IMMORTALWRT_VERSION_CODE=${IMMORTALWRT_VERSION_CODE}"
            echo "IMMORTALWRT_COMMIT=${IMMORTALWRT_COMMIT}"
          } >> "${GITHUB_ENV}"
          mkdir -p dist/metadata
          python3 scripts/openwrt_build_preflight.py collect-apk-package-index \
            --apk-bin imagebuilder/staging_dir/host/bin/apk \
            --repositories imagebuilder/repositories \
            --keys-dir imagebuilder/keys \
            --architecture i386_pentium4 \
            --package-index dist/metadata/package-index.json \
            --provenance dist/metadata/upstream-provenance.json
          python3 scripts/openwrt_build_preflight.py resolve-source-refs \
            --components config/third-party-components.json \
            --feeds-buildinfo-url "${IB_BASE_URL}/feeds.buildinfo" \
            --immortalwrt-commit "${IMMORTALWRT_COMMIT}" \
            --out dist/metadata/source-refs.json \
            --retries 5 \
            --timeout 30

      - name: Build official generic image
        run: |
          mkdir -p build-out
          cd imagebuilder
          make manifest PROFILE="generic" | tee /tmp/base.packages.manifest.log
          awk '/^[A-Za-z0-9_.+:-]+ - / {print}' /tmp/base.packages.manifest.log \
            > "${GITHUB_WORKSPACE}/build-out/base.packages.manifest"
          test -s "${GITHUB_WORKSPACE}/build-out/base.packages.manifest"
          forbidden_packages='^(daed|luci-app-daede|luci-app-mosdns|mosdns|luci-app-passwall2|luci-app-openclash|luci-app-nikki|luci-i18n-nikki-zh-cn|nikki|mihomo-meta|v2ray-geoip|v2ray-geosite) - '
          if grep -Eq "${forbidden_packages}" "${GITHUB_WORKSPACE}/build-out/base.packages.manifest"; then
            echo "Official base manifest unexpectedly contains a removed proxy or DNS package:" >&2
            grep -E "${forbidden_packages}" "${GITHUB_WORKSPACE}/build-out/base.packages.manifest" >&2
            exit 1
          fi
          make image PROFILE="generic"
          images=(bin/targets/"${IB_TARGET}"/*squashfs-combined-efi.img.gz)
          if [ "${#images[@]}" -ne 1 ]; then
            echo "Expected exactly one squashfs EFI image, found ${#images[@]}" >&2
            exit 1
          fi
          cp "${images[0]}" "${GITHUB_WORKSPACE}/build-out/immortalwrt-x86-generic.img.gz"

      - name: Convert and assemble release bundle
        id: convert
        run: |
          python3 scripts/openwrt_img_to_ova.py scan \
            --img-dir build-out \
            --manifest dist/release-state.json \
            --out-dir dist \
            --results dist/build-results.json \
            --nic-count 1 \
            --release-date "${BUILD_DATE}" \
            --immortalwrt-version-code "${IMMORTALWRT_VERSION_CODE}" \
            --immortalwrt-commit "${IMMORTALWRT_COMMIT}"
          python3 scripts/openwrt_build_preflight.py copy-raw-images \
            --results dist/build-results.json \
            --source-dir build-out \
            --out-dir dist
          python3 scripts/generate_release_metadata.py \
            --manifest build-out/base.packages.manifest \
            --components config/third-party-components.json \
            --package-index dist/metadata/package-index.json \
            --provenance dist/metadata/upstream-provenance.json \
            --source-refs dist/metadata/source-refs.json \
            --results dist/build-results.json \
            --out-dir dist/metadata \
            --imagebuilder-version "${IB_VERSION}" \
            --imagebuilder-sha256 "${IB_ARCHIVE_SHA256}" \
            --immortalwrt-version-code "${IMMORTALWRT_VERSION_CODE}" \
            --immortalwrt-commit "${IMMORTALWRT_COMMIT}" \
            --build-date "${BUILD_DATE}" \
            --repository "${GITHUB_REPOSITORY}"
          count="$(python3 -c 'import json; print(len(json.load(open("dist/build-results.json"))["built"]))')"
          echo "count=${count}" >> "${GITHUB_OUTPUT}"

      - name: Upload verified release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: immortalwrt-release-bundle-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: >-
      needs.build.outputs.count != '0' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.publish_release))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download verified release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: immortalwrt-release-bundle-${{ github.run_id }}
          path: dist

      - name: Attest firmware provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.img.gz
            dist/*.ova

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/publish_releases.py \
            dist/build-results.json \
            --metadata-dir dist/metadata \
            --keep-releases 30
