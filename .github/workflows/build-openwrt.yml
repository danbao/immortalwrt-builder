name: Build OpenWrt

on:
  workflow_dispatch:
  schedule:
    # Sunday 02:00 Asia/Shanghai
    - cron: "0 18 * * 6"

permissions:
  contents: write

concurrency:
  group: build-openwrt
  cancel-in-progress: false

env:
  IB_VERSION: "24.10.6"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev zlib1g-dev gawk git gettext \
            libssl-dev xsltproc rsync wget unzip python3 zstd qemu-utils

      - name: Download ImageBuilder
        run: |
          wget -q "https://downloads.immortalwrt.org/releases/${IB_VERSION}/targets/x86/64/immortalwrt-imagebuilder-${IB_VERSION}-x86-64.Linux-x86_64.tar.zst"
          tar --zstd -xf "immortalwrt-imagebuilder-${IB_VERSION}-x86-64.Linux-x86_64.tar.zst"
          mv "immortalwrt-imagebuilder-${IB_VERSION}-x86-64.Linux-x86_64" imagebuilder

      - name: Collect release metadata
        run: |
          version_code="$(wget -qO- "https://downloads.immortalwrt.org/releases/${IB_VERSION}/targets/x86/64/version.buildinfo" | tr -d '[:space:]')"
          immortalwrt_commit="${version_code##*-}"
          if [ -z "${version_code}" ] || [ "${immortalwrt_commit}" = "${version_code}" ]; then
            echo "Failed to parse ImmortalWrt version.buildinfo: ${version_code}" >&2
            exit 1
          fi
          {
            echo "BUILD_DATE=$(TZ=Asia/Shanghai date +%Y%m%d)"
            echo "IMMORTALWRT_VERSION_CODE=${version_code}"
            echo "IMMORTALWRT_COMMIT=${immortalwrt_commit}"
          } >> "${GITHUB_ENV}"
          echo "ImmortalWrt version: ${version_code}"
          echo "ImmortalWrt commit: ${immortalwrt_commit}"

      - name: Disable auxiliary image formats
        run: |
          cd imagebuilder
          sed -i \
            -e 's/^CONFIG_ISO_IMAGES=y/# CONFIG_ISO_IMAGES is not set/' \
            -e 's/^CONFIG_QCOW2_IMAGES=y/# CONFIG_QCOW2_IMAGES is not set/' \
            -e 's/^CONFIG_VDI_IMAGES=y/# CONFIG_VDI_IMAGES is not set/' \
            -e 's/^CONFIG_VMDK_IMAGES=y/# CONFIG_VMDK_IMAGES is not set/' \
            -e 's/^CONFIG_VHDX_IMAGES=y/# CONFIG_VHDX_IMAGES is not set/' \
            .config
          grep -E "^(CONFIG_(ISO|QCOW2|VDI|VMDK|VHDX)_IMAGES|# CONFIG_(ISO|QCOW2|VDI|VMDK|VHDX)_IMAGES)" .config

      - name: Configure third-party package feeds
        run: |
          cd imagebuilder
          cat >> repositories.conf <<'EOF'
          src/gz nikki https://nikkinikki.pages.dev/openwrt-24.10/x86_64/nikki
          src/gz momo https://momomomo.pages.dev/openwrt-24.10/x86_64/momo
          src/gz passwall2 https://master.dl.sourceforge.net/project/openwrt-passwall-build/releases/packages-24.10/x86_64/passwall2
          src/gz passwall_packages https://master.dl.sourceforge.net/project/openwrt-passwall-build/releases/packages-24.10/x86_64/passwall_packages
          EOF
          sed -i '/option check_signature/d' repositories.conf

      - name: Add local packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd imagebuilder
          gh release download --repo asvow/luci-app-tailscale --pattern '*_all.ipk' --dir packages
          gh release download --repo sbwml/luci-app-mosdns --pattern 'x86_64-openwrt-24.10.tar.gz' --dir /tmp/mosdns
          mkdir -p /tmp/mosdns/extract
          tar -xzf /tmp/mosdns/x86_64-openwrt-24.10.tar.gz -C /tmp/mosdns/extract
          find /tmp/mosdns/extract -name '*.ipk' -exec mv {} packages/ \;
          ls -lh packages/

      - name: Build image
        run: |
          cd imagebuilder
          mkdir -p files/etc/sysctl.d files/etc/uci-defaults
          cat > files/etc/sysctl.d/99-bypass-router.conf <<'EOF'
          # BBR congestion control
          net.core.default_qdisc=fq
          net.ipv4.tcp_congestion_control=bbr
          # Forwarding (bypass router core duty)
          net.ipv4.ip_forward=1
          net.ipv6.conf.all.forwarding=1
          # Raise conntrack limit for proxy connection storms
          net.netfilter.nf_conntrack_max=65536
          # TCP Fast Open
          net.ipv4.tcp_fastopen=3
          # Larger socket buffers for high-throughput forwarding
          net.core.rmem_max=67108864
          net.core.wmem_max=67108864
          net.core.rmem_default=262144
          net.core.wmem_default=262144
          net.ipv4.tcp_rmem=4096 87380 67108864
          net.ipv4.tcp_wmem=4096 65536 67108864
          # Don't send/accept ICMP redirects
          net.ipv4.conf.all.send_redirects=0
          net.ipv4.conf.default.send_redirects=0
          net.ipv4.conf.all.accept_redirects=0
          net.ipv4.conf.default.accept_redirects=0
          # Loose reverse-path filter (bypass traffic returns from unexpected interfaces)
          net.ipv4.conf.all.rp_filter=2
          net.ipv4.conf.default.rp_filter=2
          EOF
          cat > files/etc/uci-defaults/99-bypass-router.sh <<'EOF'
          #!/bin/sh
          # Bypass router: don't run DHCP/RA — the main router owns address assignment.
          uci set dhcp.lan.ignore=1
          uci set dhcp.lan.ra='disabled'
          uci set dhcp.lan.dhcpv6='disabled'
          uci commit dhcp
          exit 0
          EOF
          chmod +x files/etc/uci-defaults/99-bypass-router.sh
          make image PROFILE="generic" FILES="files/" ROOTFS_PARTSIZE="1024" PACKAGES="\
            luci luci-i18n-base-zh-cn luci-theme-argon \
            luci-app-passwall2 luci-app-mosdns luci-app-openclash \
            luci-app-nikki luci-app-momo luci-app-vlmcsd \
            luci-app-tailscale tailscale luci-app-zerotier zerotier \
            kmod-vmxnet3 open-vm-tools kmod-igb kmod-e1000e \
            kmod-tcp-bbr kmod-tun irqbalance luci-app-upnp kmod-nft-offload \
            luci-app-statistics collectd-mod-cpu collectd-mod-interface collectd-mod-load collectd-mod-memory collectd-mod-ping collectd-mod-uptime collectd-mod-iptables \
            ip-full ca-bundle curl htop ethtool kmod-fs-ext4 kmod-fs-exfat \
            openssh-sftp-server tcpdump mtr iperf3 bind-dig"

      - name: Collect image
        run: |
          image="$(ls imagebuilder/bin/targets/x86/64/*squashfs-combined-efi.img.gz)"
          mkdir -p build-out
          cp "${image}" build-out/immortalwrt-x86-64.img.gz
          ls -lh build-out/

      - name: Convert to OVA
        id: convert
        run: |
          python3 scripts/openwrt_img_to_ova.py scan \
            --img-dir build-out \
            --manifest manifests/converted-images.json \
            --out-dir dist \
            --results dist/build-results.json \
            --nic-count 1 \
            --release-date "${BUILD_DATE}" \
            --immortalwrt-version-code "${IMMORTALWRT_VERSION_CODE}" \
            --immortalwrt-commit "${IMMORTALWRT_COMMIT}"
          count="$(python3 -c 'import json; print(len(json.load(open("dist/build-results.json"))["built"]))')"
          echo "count=${count}" >> "${GITHUB_OUTPUT}"

      - name: Publish release
        if: steps.convert.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/publish_releases.py dist/build-results.json
          tag="$(python3 -c 'import json; print(json.load(open("dist/build-results.json"))["built"][0]["release_tag"])')"
          gh release upload "${tag}" build-out/immortalwrt-x86-64.img.gz

      - name: Record converted images
        if: steps.convert.outputs.count != '0'
        run: |
          python3 scripts/openwrt_img_to_ova.py record \
            --results dist/build-results.json \
            --manifest manifests/converted-images.json \
            --doc docs/converted-images.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifests/converted-images.json docs/converted-images.md
          git commit -m "docs: record converted OpenWrt images [skip ci]" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}"
