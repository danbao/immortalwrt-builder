name: Build OpenWrt

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner label; use self-hosted to build on your own runner (label must include "self-hosted")
        required: true
        default: "ubuntu-latest"
        type: choice
        options:
          - "ubuntu-latest"
          - "self-hosted"
      ib_version:
        description: ImmortalWrt ImageBuilder version; default 25.12.1, override only with publish_release=false for dry-run validation
        required: true
        default: "25.12.1"
      publish_release:
        description: Publish GitHub Release and record manifest/docs
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  schedule:
    # Every Monday 02:00 Asia/Shanghai; the schedule job limits builds to even ISO weeks.
    - cron: "0 18 * * 0"

permissions:
  contents: write

concurrency:
  group: build-openwrt
  cancel-in-progress: false

env:
  IB_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.ib_version || '25.12.1' }}
  PUBLISH_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release || 'true' }}
  DAED_PACKAGES: luci luci-i18n-base-zh-cn luci-theme-argon luci-app-vlmcsd daed luci-app-daede

jobs:
  schedule:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Check biweekly schedule
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          iso_week="$(TZ=Asia/Shanghai date +%V)"
          if [ "$((10#${iso_week} % 2))" -eq 0 ]; then
            echo "should_build=true" >> "${GITHUB_OUTPUT}"
          else
            echo "should_build=false" >> "${GITHUB_OUTPUT}"
          fi

  build:
    needs: schedule
    if: needs.schedule.outputs.should_build == 'true'
    # Scheduled runs always use the GitHub-hosted runner; manual dispatch can pick "self-hosted".
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Clean workspace from previous runs
        run: |
          rm -rf imagebuilder build-out dist "immortalwrt-imagebuilder-${IB_VERSION}-x86-64.Linux-x86_64.tar.zst"
          mkdir -p build-out dist

      - name: Install dependencies
        run: |
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
          sudo apt-get install -y -o Acquire::Retries=3 -o Acquire::http::Timeout=120 -o Acquire::https::Timeout=120 \
            build-essential libncurses-dev zlib1g-dev gawk git gettext \
            libssl-dev xsltproc rsync wget unzip python3 zstd qemu-utils

      - name: Download ImageBuilder
        run: |
          python3 scripts/openwrt_build_preflight.py imagebuilder-info \
            --version "${IB_VERSION}" \
            --target "x86/64" \
            --github-env "${GITHUB_ENV}" \
            --retries 8 \
            --timeout 30
          source "${GITHUB_ENV}"
          python3 scripts/openwrt_build_preflight.py download-url \
            --url "${IB_BASE_URL}/${IB_ARCHIVE}" \
            --output "${IB_ARCHIVE}" \
            --sha256 "${IB_ARCHIVE_SHA256}" \
            --retries 8 \
            --timeout 300
          tar --zstd -xf "${IB_ARCHIVE}"
          mv "immortalwrt-imagebuilder-${IB_VERSION}-x86-64.Linux-x86_64" imagebuilder

      - name: Collect release metadata
        run: |
          source "${GITHUB_ENV}"
          version_code="$(curl -fsSL --retry 8 --retry-delay 5 --connect-timeout 30 "${IB_BASE_URL}/version.buildinfo" | tr -d '[:space:]')"
          immortalwrt_commit="${version_code##*-}"
          if [ -z "${version_code}" ] || [ "${immortalwrt_commit}" = "${version_code}" ]; then
            echo "Failed to parse ImmortalWrt version.buildinfo: ${version_code}" >&2
            exit 1
          fi
          {
            echo "BUILD_DATE=$(TZ=Asia/Shanghai date +%Y%m%d)"
            echo "IMMORTALWRT_VERSION_CODE=${version_code}"
            echo "IMMORTALWRT_COMMIT=${immortalwrt_commit}"
          } >> "${GITHUB_ENV}"
          echo "ImmortalWrt version: ${version_code}"
          echo "ImmortalWrt commit: ${immortalwrt_commit}"

      - name: Disable auxiliary image formats
        run: |
          cd imagebuilder
          sed -i \
            -e 's/^CONFIG_ISO_IMAGES=y/# CONFIG_ISO_IMAGES is not set/' \
            -e 's/^CONFIG_QCOW2_IMAGES=y/# CONFIG_QCOW2_IMAGES is not set/' \
            -e 's/^CONFIG_VDI_IMAGES=y/# CONFIG_VDI_IMAGES is not set/' \
            -e 's/^CONFIG_VMDK_IMAGES=y/# CONFIG_VMDK_IMAGES is not set/' \
            -e 's/^CONFIG_VHDX_IMAGES=y/# CONFIG_VHDX_IMAGES is not set/' \
            .config
          grep -E "^(CONFIG_(ISO|QCOW2|VDI|VMDK|VHDX)_IMAGES|# CONFIG_(ISO|QCOW2|VDI|VMDK|VHDX)_IMAGES)" .config

      - name: Fetch daed packages
        run: |
          mkdir -p imagebuilder/packages dist
          python3 scripts/openwrt_build_preflight.py daed-packages \
            --config config/daed-feed.json \
            --out-dir imagebuilder/packages \
            --metadata-out dist/daed-packages.json \
            --retries 8 \
            --timeout 300
          ls -lh imagebuilder/packages/

      - name: Build daed image
        run: |
          cd imagebuilder
          make manifest PROFILE="generic" PACKAGES="${DAED_PACKAGES}" | tee /tmp/daed.packages.manifest.log
          mkdir -p "${GITHUB_WORKSPACE}/build-out"
          awk '/^[A-Za-z0-9_.+:-]+ - / {print}' /tmp/daed.packages.manifest.log \
            > "${GITHUB_WORKSPACE}/build-out/daed.packages.manifest"
          test -s "${GITHUB_WORKSPACE}/build-out/daed.packages.manifest"
          grep -Eq '^daed - ' "${GITHUB_WORKSPACE}/build-out/daed.packages.manifest"
          grep -Eq '^luci-app-daede - ' "${GITHUB_WORKSPACE}/build-out/daed.packages.manifest"
          grep -Eq '^luci-app-vlmcsd - ' "${GITHUB_WORKSPACE}/build-out/daed.packages.manifest"
          forbidden_packages='^(luci-app-passwall2|luci-app-openclash|luci-app-nikki|luci-i18n-nikki-zh-cn|nikki|mihomo-meta|luci-app-mosdns|mosdns) - '
          if grep -Eq "${forbidden_packages}" "${GITHUB_WORKSPACE}/build-out/daed.packages.manifest"; then
            echo "Manifest unexpectedly contains a removed proxy or DNS package:" >&2
            grep -E "${forbidden_packages}" "${GITHUB_WORKSPACE}/build-out/daed.packages.manifest" >&2
            exit 1
          fi
          rm -rf bin/targets/x86/64
          make image PROFILE="generic" FILES="${GITHUB_WORKSPACE}/files" ROOTFS_PARTSIZE="2048" PACKAGES="${DAED_PACKAGES}"

          shopt -s nullglob
          images=(bin/targets/x86/64/*squashfs-combined-efi.img.gz)
          if [ "${#images[@]}" -ne 1 ]; then
            echo "Expected exactly one daed squashfs EFI image, found ${#images[@]}" >&2
            printf '%s\n' "${images[@]}" >&2
            exit 1
          fi
          cp "${images[0]}" "${GITHUB_WORKSPACE}/build-out/immortalwrt-x86-64-daed.img.gz"
          ls -lh "${GITHUB_WORKSPACE}/build-out/"

      - name: Convert to OVA
        id: convert
        run: |
          python3 scripts/openwrt_img_to_ova.py scan \
            --img-dir build-out \
            --manifest manifests/converted-images.json \
            --out-dir dist \
            --results dist/build-results.json \
            --nic-count 1 \
            --release-date "${BUILD_DATE}" \
            --immortalwrt-version-code "${IMMORTALWRT_VERSION_CODE}" \
            --immortalwrt-commit "${IMMORTALWRT_COMMIT}"
          count="$(python3 -c 'import json; print(len(json.load(open("dist/build-results.json"))["built"]))')"
          echo "count=${count}" >> "${GITHUB_OUTPUT}"

      - name: Publish release
        if: steps.convert.outputs.count != '0' && env.PUBLISH_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/openwrt_build_preflight.py copy-raw-images \
            --results dist/build-results.json \
            --source-dir build-out \
            --out-dir dist
          python3 scripts/publish_releases.py dist/build-results.json --keep-releases 30

      - name: Record converted images
        if: steps.convert.outputs.count != '0' && env.PUBLISH_RELEASE == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mapfile -t release_tags < <(python3 -c 'import json; print("\n".join(item["release_tag"] for item in json.load(open("dist/build-results.json"))["built"]))')
          python3 scripts/openwrt_img_to_ova.py record \
            --results dist/build-results.json \
            --manifest manifests/converted-images.json \
            --doc docs/converted-images.md
          verify_args=()
          for tag in "${release_tags[@]}"; do
            verify_args+=(--release-tag "${tag}")
          done
          python3 scripts/openwrt_build_preflight.py verify-records \
            --manifest manifests/converted-images.json \
            --doc docs/converted-images.md \
            "${verify_args[@]}" \
            --check-latest-release
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifests/converted-images.json docs/converted-images.md
          git commit -m "docs: record converted OpenWrt images [skip ci]" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload dry-run artifacts
        if: env.PUBLISH_RELEASE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-dry-run-${{ env.IB_VERSION }}
          path: |
            build-out/*
            dist/*
          if-no-files-found: error
