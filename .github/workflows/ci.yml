name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build pinned ucode compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libjson-c-dev zlib1g-dev
          git clone --filter=blob:none --no-checkout "https://github.com/jow-/ucode.git" ".ci-ucode"
          git -C ".ci-ucode" checkout --detach "85922056ef7abeace3cca3ab28bc1ac2d88e31b1"
          test "$(git -C ".ci-ucode" rev-parse HEAD)" = "85922056ef7abeace3cca3ab28bc1ac2d88e31b1"
          cmake -S ".ci-ucode" -B ".ci-ucode/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/.ci-tools" \
            -DCMAKE_INSTALL_RPATH="${GITHUB_WORKSPACE}/.ci-tools/lib" \
            -DUBUS_SUPPORT=OFF -DUCI_SUPPORT=OFF -DULOOP_SUPPORT=OFF \
            -DNL80211_SUPPORT=OFF -DRTNL_SUPPORT=OFF -DRESOLV_SUPPORT=OFF \
            -DLOG_SUPPORT=OFF -DDIGEST_SUPPORT=OFF
          cmake --build ".ci-ucode/build" --parallel 2
          cmake --install ".ci-ucode/build"
          test -x ".ci-tools/bin/ucode"
          echo "UCODE_BIN=${GITHUB_WORKSPACE}/.ci-tools/bin/ucode" >> "${GITHUB_ENV}"

      - name: Validate Python
        run: |
          python3 -m py_compile scripts/*.py
          python3 -m unittest discover -s tests

      - name: Validate ucode
        run: |
          "${UCODE_BIN}" -c files/usr/libexec/immortalwrt-updater-plan.uc
          "${UCODE_BIN}" -c files/usr/share/rpcd/ucode/immortalwrt-updater.uc

      - name: Validate LuCI and RPC data
        run: |
          node --check files/www/luci-static/resources/view/system/immortalwrt-updater.js
          jq empty files/usr/share/rpcd/acl.d/immortalwrt-updater.json \
            files/usr/share/luci/menu.d/immortalwrt-updater.json

      - name: Validate workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Validate shell
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck \
            files/etc/uci-defaults/99-bypass-router.sh \
            files/etc/hotplug.d/iface/99-bypass-router-hardening \
            files/etc/init.d/bypass-router-hardening \
            files/usr/sbin/bypass-router-configure \
            files/usr/sbin/bypass-router-cutover \
            files/usr/sbin/bypass-router-harden \
            files/usr/sbin/bypass-router-apply-sysctl \
            files/usr/sbin/immortalwrt-updater \
            files/usr/sbin/bypass-router-daed-configure \
            files/usr/share/luci-app-daede/daed-filter-sync.sh \
            files/usr/local/sbin/daed-subscription-sync \
            files/usr/local/sbin/mosdns-geo-update-verified
