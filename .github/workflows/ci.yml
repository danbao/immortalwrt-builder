name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate scripts and configuration
        run: |
          python3 -m py_compile scripts/*.py
          python3 -m unittest discover -s tests
          bash -n scripts/setup-openwrt.sh
          for script in files/etc/uci-defaults/*.sh; do
            bash -n "${script}"
            dash -n "${script}"
          done
          # The wizard library owns RED, while SSH wrappers intentionally pass
          # single-quoted scripts for expansion on the router rather than the host.
          shellcheck --exclude=SC2016,SC2029,SC2034 scripts/setup-openwrt.sh files/etc/uci-defaults/*.sh
          python3 - <<'PY'
          import json
          from pathlib import Path

          for path in sorted(Path(".").rglob("*.json")):
              if any(part.startswith(".") and part != "." for part in path.parts):
                  continue
              json.loads(path.read_text(encoding="utf-8"))
              print(f"valid JSON: {path}")
          PY
